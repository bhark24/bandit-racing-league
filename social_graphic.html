<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff00;
            --dark-bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.9);
            --border-radius: 8px;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --text-light: #ffffff;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            background-color: var(--dark-bg);
            background-image: 
                linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.95)),
                url('assets/carbon_fiber_texture.png');
            background-size: cover, auto;
            font-family: var(--font-body);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
            border: 8px solid var(--neon-green);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 60px 20px 60px;
            border-bottom: 2px solid rgba(0, 255, 0, 0.2);
            background: rgba(10, 10, 10, 0.6);
        }

        .header-logo {
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 255, 0, 0.25));
        }

        .header-title-container {
            text-align: right;
        }

        .header-main-title {
            font-family: var(--font-heading);
            font-size: 46px;
            font-weight: 900;
            font-style: italic;
            color: var(--text-light);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-sub-title {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-green);
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .main-layout {
            display: flex;
            flex: 1;
            padding: 40px 60px;
            gap: 40px;
            box-sizing: border-box;
        }

        .left-column {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid rgba(0, 255, 0, 0.15);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--neon-green);
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-light);
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .accent-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--neon-green);
        }

        /* Winner Panel Styles */
        .winner-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0;
        }

        .winner-number-img {
            max-height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 255, 0, 0.4));
            margin-bottom: 15px;
        }

        .winner-fallback-number {
            font-family: var(--font-heading);
            font-size: 90px;
            font-weight: 900;
            font-style: italic;
            color: var(--neon-green);
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            line-height: 1;
        }

        .winner-name {
            font-family: var(--font-heading);
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-light);
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .winner-details-divider {
            width: 150px;
            height: 3px;
            background: var(--neon-green);
            margin: 20px 0;
            box-shadow: 0 0 8px var(--neon-green);
        }

        .winner-track-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .winner-track-logo {
            max-height: 80px;
            max-width: 140px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        .winner-track-text-group {
            text-align: left;
        }

        .winner-track-name {
            font-size: 26px;
            font-weight: 700;
            margin: 0;
            color: var(--text-light);
        }

        .winner-race-date {
            font-size: 16px;
            color: var(--text-muted);
            margin: 3px 0 0 0;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 10px 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 15px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .rank-cell {
            width: 40px;
            font-weight: 900;
            font-family: var(--font-heading);
            color: var(--text-muted);
        }

        tr:nth-child(-n+3) .rank-cell {
            color: var(--neon-green);
        }

        .name-cell {
            font-weight: 700;
            color: var(--text-light);
        }

        .value-cell {
            text-align: right;
            font-weight: 700;
            font-family: var(--font-heading);
        }

        .wins-badge {
            font-size: 13px;
            background-color: rgba(0, 255, 0, 0.15);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 10px;
            font-weight: bold;
        }

        .footer-banner {
            text-align: center;
            padding: 20px;
            background: rgba(10, 10, 10, 0.8);
            border-top: 1px solid rgba(0, 255, 0, 0.15);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .footer-banner span {
            color: var(--neon-green);
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="assets/main-logo.png" class="header-logo" alt="BRL Logo">
        <div class="header-title-container">
            <h1 class="header-main-title">Bandit Racing League</h1>
            <h2 class="header-sub-title">Weekly Post-Race Update</h2>
        </div>
    </div>

    <div class="main-layout">
        
        <div class="left-column">
            <div class="card" style="flex: 1;">
                <div class="card-title">
                    <span class="accent-dot"></span> Race Winner Spotlight
                </div>
                <div class="winner-panel">
                    <img id="winner-num-img" class="winner-number-img" src="" style="display: none;">
                    <div id="winner-fallback-num" class="winner-fallback-number">#00</div>
                    <div id="winner-driver-name" class="winner-name">Winner Driver</div>
                    <div class="winner-details-divider"></div>
                    <div class="winner-track-container">
                        <img id="winner-track-logo" class="winner-track-logo" src="" style="display: none;">
                        <div class="winner-track-text-group">
                            <h3 id="winner-track-name" class="winner-track-name">Track Name</h3>
                            <p id="winner-race-date" class="winner-race-date">Race Date</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-column">
            
            <!-- Team Standings -->
            <div class="card" style="flex: 1;">
                <div class="card-title">
                    <span class="accent-dot"></span> Franchise Team Standings
                </div>
                <table id="team-table">
                    <thead>
                        <tr>
                            <th class="rank-cell">#</th>
                            <th>Team</th>
                            <th style="text-align: right;">Points</th>
                        </tr>
                    </thead>
                    <tbody id="team-tbody">
                        <!-- Filled dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Fantasy Leaderboard -->
            <div class="card" style="flex: 1;">
                <div class="card-title">
                    <span class="accent-dot"></span> Fantasy Challenge Leaderboard
                </div>
                <table id="fantasy-table">
                    <thead>
                        <tr>
                            <th class="rank-cell">#</th>
                            <th>Player</th>
                            <th style="text-align: right;">Points</th>
                        </tr>
                    </thead>
                    <tbody id="fantasy-tbody">
                        <!-- Filled dynamically -->
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <div class="footer-banner">
        Visit <span>banditracingleague.net</span> for full standings, driver statistics, & roster updates
    </div>

    <!-- Data Loading script -->
    <script src="weekly_data.js"></script>
    <script>
        const NUMBER_IMAGES = {
            "ALLENSTEENBAKKER": "16.png", "AUSTINCOOPER": "Austin Cooper.png", "BENJAMINLACY": "Benjamin Lacy.png",
            "CARTERPHILLIPS": "Carter Phillips.png", "DAVISCARROLL": "Davis Carroll.png", "DILLONNICASTRO": "Dillon.png",
            "DIONTERADER": "Dionte_number.png", "EDDIEHAGIGH": "Eddie Hagigh.png", "ETHANSIKORSKI": "Ethan Sikorski.png",
            "JACKSONDUKE": "Jackson_Duke.png", "JASONALLEGRINI": "Jason Allegrini.png", "JOSHADAMS": "Josh Adams.png",
            "JOSHBILLITER": "Josh Billiter.png", "JOSHBILITER": "Josh Billiter.png", "LOGANMURRAY": "Logan Murray.png",
            "MARKALANBIVENS": "Mark Alan Bivens.png", "MATTCROCKETT": "Matt Crockett.png", "MICHAELRAKES": "Michael Rakes.png",
            "NATHANSANTOS": "Nathan Santos.png", "SEANBRITT": "Sean Britt.png", "TYCORINO": "Ty Corino.png",
            "VICTORWEAVER": "Victor Weaver.png", "DYLANNICASTRO": "Dillon.png", "NICOLEKRIESEL": "Nicole Kriesel.png",
            "NICOLEKREISEL": "Nicole Kriesel.png"
        };

        function normalizeName(name) {
            if (!name) return '';
            let n = name.trim().toUpperCase().replace(/[^A-Z]/g, '');
            const spellingMap = {
                "TERRYKONDAS": "TERRYKONDUS",
                "CONORGIBSON": "CONNORGIBSON",
                "DIONTERADER": "DINTERADER",
                "DIANTERODER": "DINTERADER",
                "JONATHONPLATT": "JONATHONPLATT",
                "JOHNATHONPLATT": "JONATHONPLATT",
                "JOSHUADSUTHERLAND": "JOSHUASUTHERLAND"
            };
            return spellingMap[n] || n;
        }

        function getDriverImgPath(name) {
            if (!name) return '';
            const norm = normalizeName(name);
            if (NUMBER_IMAGES[norm]) {
                return `assets/drivers numbers/${NUMBER_IMAGES[norm]}`;
            }
            const formattedName = name.trim().toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return `assets/drivers numbers/${formattedName}.png`;
        }

        // Render Winner Spotlight
        if (typeof weeklyData !== 'undefined') {
            document.getElementById('winner-driver-name').innerText = weeklyData.winnerName || "TBD";
            document.getElementById('winner-track-name').innerText = weeklyData.trackName || "Unknown Track";
            document.getElementById('winner-race-date').innerText = weeklyData.raceDate || "Date TBD";
            
            // Try loading driver number
            const numImg = document.getElementById('winner-num-img');
            const fallbackNum = document.getElementById('winner-fallback-num');
            const driverNumImgPath = getDriverImgPath(weeklyData.winnerName);
            
            if (driverNumImgPath) {
                const tempImg = new Image();
                tempImg.src = driverNumImgPath;
                tempImg.onload = function() {
                    numImg.src = driverNumImgPath;
                    numImg.style.display = 'block';
                    fallbackNum.style.display = 'none';
                };
                tempImg.onerror = function() {
                    numImg.style.display = 'none';
                    fallbackNum.style.display = 'block';
                    fallbackNum.innerText = weeklyData.winnerNumber ? `#${weeklyData.winnerNumber}` : '#--';
                };
            } else {
                fallbackNum.innerText = weeklyData.winnerNumber ? `#${weeklyData.winnerNumber}` : '#--';
            }

            // Try loading track logo
            if (weeklyData.trackLogo) {
                const trackLogoImg = document.getElementById('winner-track-logo');
                const trackLogoPath = `assets/tracks/Track Logos/${weeklyData.trackLogo}`;
                const tempTrackImg = new Image();
                tempTrackImg.src = trackLogoPath;
                tempTrackImg.onload = function() {
                    trackLogoImg.src = trackLogoPath;
                    trackLogoImg.style.display = 'block';
                };
                tempTrackImg.onerror = function() {
                    trackLogoImg.style.display = 'none';
                };
            }

            // Render Team Standings (Top 5)
            const teamTbody = document.getElementById('team-tbody');
            if (weeklyData.teamStandings && weeklyData.teamStandings.length > 0) {
                weeklyData.teamStandings.slice(0, 5).forEach((team, idx) => {
                    const tr = document.createElement('tr');
                    
                    const rankTd = document.createElement('td');
                    rankTd.className = 'rank-cell';
                    rankTd.innerText = idx + 1;
                    tr.appendChild(rankTd);
                    
                    const nameTd = document.createElement('td');
                    nameTd.className = 'name-cell';
                    nameTd.innerText = team.name;
                    if (team.wins > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'wins-badge';
                        badge.innerText = `${team.wins} Win${team.wins > 1 ? 's' : ''}`;
                        nameTd.appendChild(badge);
                    }
                    tr.appendChild(nameTd);
                    
                    const ptsTd = document.createElement('td');
                    ptsTd.className = 'value-cell';
                    ptsTd.innerText = team.points;
                    tr.appendChild(ptsTd);
                    
                    teamTbody.appendChild(tr);
                });
            } else {
                teamTbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No standings data available.</td></tr>';
            }

            // Render Fantasy Leaderboard (Top 5)
            const fantasyTbody = document.getElementById('fantasy-tbody');
            if (weeklyData.fantasyLeaderboard && weeklyData.fantasyLeaderboard.length > 0) {
                weeklyData.fantasyLeaderboard.slice(0, 5).forEach((fan, idx) => {
                    const tr = document.createElement('tr');
                    
                    const rankTd = document.createElement('td');
                    rankTd.className = 'rank-cell';
                    rankTd.innerText = idx + 1;
                    tr.appendChild(rankTd);
                    
                    const nameTd = document.createElement('td');
                    nameTd.className = 'name-cell';
                    nameTd.innerText = fan.name;
                    if (fan.wins > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'wins-badge';
                        badge.innerText = `${fan.wins} Win${fan.wins > 1 ? 's' : ''}`;
                        nameTd.appendChild(badge);
                    }
                    tr.appendChild(nameTd);
                    
                    const ptsTd = document.createElement('td');
                    ptsTd.className = 'value-cell';
                    ptsTd.innerText = fan.score;
                    tr.appendChild(ptsTd);
                    
                    fantasyTbody.appendChild(tr);
                });
            } else {
                fantasyTbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No fantasy leaderboard data available.</td></tr>';
            }
        }
    </script>
</body>
</html>

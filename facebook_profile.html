<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BRL Facebook Profile Picture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-container {
            position: relative;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, #141414 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Subtly textured background */
        .profile-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('assets/carbon_fiber_texture.png');
            background-repeat: repeat;
            opacity: 0.04;
            z-index: 1;
        }
        /* Glowing neon green framing circle (safe zone indicator) */
        .glow-ring {
            position: absolute;
            z-index: 2;
            width: 880px;
            height: 880px;
            border-radius: 50%;
            border: 4px solid #00e600;
            box-shadow: 0 0 30px rgba(0, 230, 0, 0.25), 
                        inset 0 0 30px rgba(0, 230, 0, 0.15);
            background: rgba(10, 10, 10, 0.4);
        }
        /* Centered logo container */
        .logo-wrapper {
            position: relative;
            z-index: 3;
            width: 680px;
            height: 680px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.7))
                    drop-shadow(0 0 15px rgba(0, 230, 0, 0.15));
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <!-- Neon green border to perfectly frame inside the circular crop -->
        <div class="glow-ring"></div>
        
        <div class="logo-wrapper">
            <img src="assets/main-logo.png" alt="Bandit Racing League Logo" class="main-logo">
        </div>
    </div>
</body>
</html>

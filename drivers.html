        function normalizeName(name) {
            if (!name) return "";
            let n = name.toUpperCase().trim().replace(/[\s\.\-_]/g, "");
            const spellingMap = {
                "TERRYKONDAS": "TERRYKONDUS",
                "CONORGIBSON": "CONNORGIBSON",
                "DI0NTERADER": "DIONTERADER",
                "DIANTERODER": "DIONTERADER",
                "DYLANMCDONALD": "DYLANMCDONALD3",
                "LUCASWILSON": "LUCASWILSON2",
                "JACKSONDUKE": "JACKSONCDUKE",
                "JONATHONPLATT": "JONATHONPLATT",
                "JOHNATHONPLATT": "JONATHONPLATT",
                "JOSHUADSUTHERLAND": "JOSHUASUTHERLAND"
            };
            return spellingMap[n] || n;
        }

        function getDriverImgPath(name) {
            if (!name) return '';
            const norm = normalizeName(name);
            if (NUMBER_IMAGES[norm]) {
                return `assets/drivers numbers/${NUMBER_IMAGES[norm]}`;
            }
            const formattedName = name.trim().toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return `assets/drivers numbers/${formattedName}.png`;
        }

        function getTruckImgPath(name) {
            if (!name) return '';
            let clean = name.toLowerCase().trim()
                .replace(/\s+jr\.?$/i, '') // Remove "Jr" suffix
                .replace(/[\s\+\-\.]+/g, '_')
                .replace(/_+/g, '_');
            return `assets/truck images/truck_image_${clean}.png`;
        }

        function findTeamsForDriver(driverName) {
            if (typeof teamsData === 'undefined' || !teamsData.teams) return [];
            
            const nameNorm = normalizeName(driverName);
            if (!nameNorm) return [];

            const matchedTeams = [];
            for (let team of teamsData.teams) {
                const primary = (team.drivers.primary || []).map(normalizeName);
                const backup = (team.drivers.backup || []).map(normalizeName);
                if (primary.includes(nameNorm) || backup.includes(nameNorm)) {
                    const isBackup = backup.includes(nameNorm);
                    matchedTeams.push({
                        team: team,
                        role: isBackup ? "Backup" : "Primary"
                    });
                }
            }
            return matchedTeams;
        }

        function renderDriverGrid() {
            grid.innerHTML = '';
            const statusMap = {
                'available': 'Available',
                'full-time': 'Full Time',
                'part-time': 'Part Time',
                'reserved': 'Reserved / Practice',
                'past-champion': 'Past Champion Reserved'
            };

            numbersList.forEach(num => {
                const data = rosterData[num] || { driver: '', status: 'available' };
                const hasDriver = data.driver && data.driver.trim() !== '' && data.driver.trim().toLowerCase() !== 'available';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-status', data.status);
                
                let teamInfoHtml = '';
                if (hasDriver) {
                    const matches = findTeamsForDriver(data.driver);
                    if (matches.length > 0) {
                        const team = matches[0].team;
                        let name = team.name.toUpperCase();
                        let base = team.homeBase.toUpperCase();
                        
                        const stateMap = {
                            'OH': 'OHIO',
                            'WI': 'WISCONSIN',
                            'NC': 'NORTH CAROLINA',
                            'FL': 'FLORIDA',
                            'GA': 'GEORGIA',
                            'VA': 'VIRGINIA',
                            'IN': 'INDIANA',
                            'TN': 'TENNESSEE',
                            'PA': 'PENNSYLVANIA',
                            'MI': 'MICHIGAN',
                            'IL': 'ILLINOIS',
                            'SC': 'SOUTH CAROLINA',
                            'KS': 'KANSAS',
                            'TX': 'TEXAS',
                            'NV': 'NEVADA',
                            'NY': 'NEW YORK',
                            'AZ': 'ARIZONA',
                            'AL': 'ALABAMA'
                        };
                        
                        base = base.replace(/,/g, '');
                        for (let [abbr, full] of Object.entries(stateMap)) {
                            let regex = new RegExp('\\b' + abbr + '$');
                            if (regex.test(base)) {
                                base = base.replace(regex, full);
                                break;
                            }
                        }
                        
                        teamInfoHtml = `
                            <div class="driver-team" style="font-style: italic; font-weight: bold; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px;">

                        `;

                }
                
                // Get Stats Link configuration
                let statsButtonHtml = '';
                if (hasDriver) {
                    const norm = normalizeName(data.driver);
                    const srhId = SRH_IDS[norm];
                    if (srhId) {
                        statsButtonHtml = `
                            <div style="margin-top: 12px;">
                                <a href="https://simracerhub.com/driver_stats.php?driver_id=${srhId}&season_id=29722" target="_blank" style="display:inline-block; color: var(--neon-green); font-size: 0.75rem; text-decoration: none; border: 1px solid var(--neon-green); padding: 4px 10px; border-radius: 4px; text-transform: uppercase; font-family: var(--font-heading); font-weight: bold; transition: all 0.3s ease;">
                                    View Stats &rarr;

                        `;

                    <div class="card-visual-banner">
                        ${hasDriver ? `
                            <img src="${getTruckImgPath(data.driver)}" class="truck-banner-img" onerror="this.remove(); document.getElementById('num-badge-${num}').classList.add('centered');">

        async function loadTeamsDataFromSupabase() {
            const hasSupabase = typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL && !SUPABASE_URL.includes("your-project-id");
            if (hasSupabase) {
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/league_data?id=eq.1`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    const result = await response.json();
                    if (result && result.length > 0 && result[0].data && Object.keys(result[0].data).length > 0) {
                        teamsData.teams = result[0].data.teams;
                        teamsData.latestRace = result[0].data.latestRace || teamsData.latestRace;
                        console.log("Drivers directory loaded latest teams data from Supabase.");
                    }
                } catch (e) {
                    console.error("Drivers directory failed to load from Supabase:", e);
                }
            }
        }

        function loadRosterDynamically() {
            const oldScript = document.getElementById('dynamic-roster-script');
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement('script');
            script.id = 'dynamic-roster-script';
            script.src = 'roster_data.js?t=' + Date.now();
            
            script.onload = async function() {
                if (typeof rosterData !== 'undefined' && typeof numbersList !== 'undefined') {
                    await loadTeamsDataFromSupabase();
                    const currentHash = JSON.stringify(rosterData);
                    if (currentHash === lastRosterJson) {
                        return;
                    }
                    lastRosterJson = currentHash;
                    renderDriverGrid();
                }
            };
            document.body.appendChild(script);
        }

        // Toggle mobile navigation menu and run initial load
        document.addEventListener('DOMContentLoaded', async function() {
            await loadTeamsDataFromSupabase();

            // Run dynamically
            if (typeof rosterData === 'undefined' || typeof numbersList === 'undefined') {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px;'>No roster data found. Please drop your exported <code>roster_data.js</code> file from the Car Number Tracker into the folder!</p>";
                setTimeout(loadRosterDynamically, 3000);
            } else {
                lastRosterJson = JSON.stringify(rosterData);
                renderDriverGrid();
                setInterval(loadRosterDynamically, 3000);
            }

            const toggleBtn = document.querySelector('.nav-toggle');
            const navContainer = document.querySelector('.nav-container');
            
            if (toggleBtn && navContainer) {
                toggleBtn.addEventListener('click', function() {
                    navContainer.classList.toggle('nav-open');
                });
            }
        });
    </script>

        </div>
    </footer>
</body>

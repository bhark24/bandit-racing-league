<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="380" height="60">
    <defs>
        <!-- Gradients & Filters -->
        <linearGradient id="clipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2d3d"/>
            <stop offset="100%" stop-color="#12141d"/>
        </linearGradient>
        <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
        </linearGradient>
        <linearGradient id="redTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff3b30"/>
            <stop offset="100%" stop-color="#ff0055"/>
        </linearGradient>
        <linearGradient id="cyanTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e5ff"/>
            <stop offset="100%" stop-color="#00aaff"/>
        </linearGradient>
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Notepad / Stewards' Clipboard Icon Group -->
    <g transform="translate(6, 4)">
        <!-- Clipboard Base Backing -->
        <rect x="2" y="6" width="38" height="48" rx="5" fill="url(#clipGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#shadow)"/>
        
        <!-- Paper Sheet -->
        <rect x="6" y="10" width="30" height="40" rx="3" fill="url(#paperGradient)"/>
        
        <!-- Top Metallic Clip -->
        <rect x="13" y="4" width="16" height="6" rx="2" fill="#8e8ea0" stroke="#4b4b5e" stroke-width="1"/>
        <circle cx="21" cy="7" r="1.5" fill="#12141d"/>
        
        <!-- Notepad Rule Lines -->
        <line x1="10" y1="18" x2="32" y2="18" stroke="#ff3b30" stroke-width="1.5"/>
        <line x1="10" y1="24" x2="28" y2="24" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="30" x2="32" y2="30" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="36" x2="24" y2="36" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="42" x2="30" y2="42" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Warning Badge on Notepad -->
        <g transform="translate(22, 28)">
            <polygon points="10,0 20,18 0,18" fill="#ff3b30" filter="url(#shadow)"/>
            <text x="10" y="15" font-family="'Outfit', 'Inter', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">!</text>
        </g>
    </g>

    <!-- Branding Text Group -->
    <g transform="translate(56, 0)">
        <!-- Top Subtext: BANDIT RACING LEAGUE -->
        <text x="0" y="22" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-size="11" font-weight="900" font-style="italic" letter-spacing="2.5" fill="#a5b4fc">
            BANDIT RACING LEAGUE
        </text>
        
        <!-- Main Title: WALL OF SHAME -->
        <text x="0" y="46" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-size="23" font-weight="900" font-style="italic" letter-spacing="1" fill="url(#redTextGrad)" filter="url(#neonGlow)">
            WALL OF SHAME
        </text>

        <!-- Stewards Hub Badge -->
        <rect x="196" y="31" width="96" height="17" rx="4" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
        <text x="244" y="43.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#00e5ff" text-anchor="middle" letter-spacing="1">
            STEWARDS HUB
        </text>
    </g>
</svg>

<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1350px;
    background-color: #050505;
    background-image: radial-gradient(circle at 50% 100%, #112211 0%, #050505 80%);
    font-family: 'Montserrat', sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  .image-container {
    width: 1080px;
    height: 608px; /* Maintain 16:9 aspect ratio of the 1024x576 image */
    background-image: url('perfect_car.png');
    background-size: cover;
    background-position: center;
    position: relative;
    border-bottom: 5px solid #00FF00;
  }
  
  .content {
    flex: 1;
    padding: 60px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
  }

  .title-section {
    text-align: center;
    margin-bottom: 30px;
  }

  .title {
    font-size: 56px;
    font-weight: 900;
    font-style: italic;
    color: #00FF00;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 0;
    text-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
  }

  .subtitle {
    font-size: 24px;
    font-weight: 700;
    color: #FFFFFF;
    margin-top: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.9;
  }

  .story {
    font-size: 26px;
    line-height: 1.6;
    font-weight: 400;
    color: #E0E0E0;
    text-align: justify;
    text-align-last: center;
    margin-bottom: 30px;
  }

  .highlight {
    color: #00FF00;
    font-weight: 700;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin-top: auto;
  }

  .logo {
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(0,255,0,0.3));
  }

  .footer-text {
    text-align: left;
    border-left: 3px solid #00FF00;
    padding-left: 20px;
  }

  .footer-title {
    font-size: 22px;
    font-weight: 900;
    color: #FFFFFF;
    margin: 0 0 5px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .footer-sub {
    font-size: 18px;
    color: #00FF00;
    margin: 0;
    font-weight: 700;
    letter-spacing: 3px;
  }

</style>
</head>
<body>

  <div class="image-container" id="story-image"></div>

  <div class="content">
    <div class="title-section">
      <h1 class="title" id="story-title">VICTORY LANE</h1>
      <div class="subtitle" id="story-subtitle">WEEKLY RACE UPDATE</div>
    </div>

    <div class="story" id="dynamic-story">
      Loading race results...
    </div>

    <div class="footer">
      <img src="assets/main-logo.png" class="logo" id="story-logo" />
      <div class="footer-text">
        <p class="footer-title" id="footer-driver">TBD</p>
        <p class="footer-sub" id="footer-sub">RACE WINNER</p>
      </div>
    </div>
  </div>

  <script src="weekly_data.js"></script>
  <script>
    if (typeof weeklyData !== 'undefined') {
      const winnerName = weeklyData.winnerName || "TBD";
      const trackName = weeklyData.trackName || "Unknown Track";
      const raceDate = weeklyData.raceDate || "Date TBD";
      const winnerNumber = weeklyData.winnerNumber ? `#${weeklyData.winnerNumber}` : "";
      
      // Update subtitle
      document.getElementById('story-subtitle').innerText = `${trackName.toUpperCase()} • ${raceDate.toUpperCase()}`;
      
      // Update story text
      document.getElementById('dynamic-story').innerHTML = `
        It takes pure speed, flawless execution, and immense focus to conquer the competition.<br><br>
        At <span class="highlight">${trackName}</span>, <span class="highlight">${winnerName}</span> did exactly that, driving a masterful race to claim a spectacular victory in Season 16 of the Bandit Racing League!<br><br>
        <span class="highlight" style="font-size: 28px; font-style: italic;">A dominant performance in Victory Lane!</span>
      `;
      
      // Update footer
      document.getElementById('footer-driver').innerText = winnerName.toUpperCase();
      document.getElementById('footer-sub').innerText = `RACE WINNER` + (winnerNumber ? ` • ${winnerNumber}` : '');
      
      // Update image if winner image exists
      if (weeklyData.winnerImage) {
        document.getElementById('story-image').style.backgroundImage = `url('${weeklyData.winnerImage}')`;
      }
    }
  </script>
</body>
</html>

name: BRL Scheduled App Alerts (Tuesday Practice, Wednesday Fantasy Lock, Pit Gate & Live Race)

on:
  schedule:
    # Runs every 15 minutes to flush pending Web Push notifications & deliver Tuesday/Wednesday scheduled alerts
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send-scheduled-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Web Push dependencies
        run: pip install pywebpush

      - name: Check schedule and broadcast due BRL App alerts
        run: python send_brl_notification.py --auto-cron

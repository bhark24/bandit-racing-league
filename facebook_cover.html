<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BRL Facebook Cover Photo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 1640px;
            height: 608px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #060606;
            color: #ffffff;
        }
        .cover-container {
            position: relative;
            width: 1640px;
            height: 608px;
            background-image: url('assets/facebook_cover_bg.png');
            background-size: cover;
            background-position: center 52%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        /* Ambient dark vignette - fading to black on the right for text readability */
        .cover-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                rgba(0,0,0,0.15) 0%, 
                rgba(0,0,0,0.2) 40%, 
                rgba(0,0,0,0.6) 65%, 
                rgba(0,0,0,0.92) 100%);
            z-index: 1;
        }
        /* Floating right brand panel */
        .brand-panel {
            position: relative;
            z-index: 2;
            width: 580px;
            height: 100%;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-left: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px 25px 30px;
            text-align: center;
        }
        /* Logo container */
        .logo-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .main-logo {
            max-height: 310px;
            max-width: 500px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 230, 0, 0.2));
            animation: subtle-pulse 4s ease-in-out infinite;
        }
        /* Text branding */
        .info-container {
            margin-top: -10px;
            width: 100%;
        }
        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 21px;
            font-weight: 900;
            color: #00e600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 230, 0, 0.3);
        }
        .seasons-badge {
            font-size: 16px;
            font-weight: 600;
            color: #b3b3b3;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .website-bar {
            background: rgba(0, 230, 0, 0.08);
            border: 1px solid rgba(0, 230, 0, 0.3);
            border-radius: 4px;
            padding: 12px 24px;
            font-family: 'Orbitron', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            display: inline-block;
            text-transform: uppercase;
        }
        /* Sponsors section */
        .sponsors-section {
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sponsors-label {
            font-size: 12px;
            font-weight: 800;
            color: #666666;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .sponsors-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        .sponsor-logo {
            height: 35px;
            max-width: 90px;
            object-fit: contain;
            transition: all 0.3s ease;
        }
        @keyframes subtle-pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 230, 0, 0.2)); }
            50% { filter: drop-shadow(0 0 25px rgba(0, 230, 0, 0.45)); }
        }
    </style>
</head>
<body>
    <div class="cover-container">
        <!-- Right side branding panel -->
        <div class="brand-panel">
            <div class="logo-container">
                <img src="assets/main-logo.png" alt="Bandit Racing League Logo" class="main-logo">
            </div>
            
            <div class="info-container">
                <div class="tagline">An iRacing Esports Racing League</div>
                <div class="seasons-badge">Competitive League Racing</div>
                <div class="website-bar">banditracingleague.net</div>
            </div>
            
            <div class="sponsors-section">
                <div class="sponsors-label">Official Partners</div>
                <div class="sponsors-row">
                    <img src="assets/geezer-logo.png" alt="Geezer Authentics" class="sponsor-logo">
                    <img src="assets/simtrax-logo.png" alt="SimTrax" class="sponsor-logo">
                    <img src="assets/Presenting-sponsor.png" alt="Presenting Sponsor" class="sponsor-logo">
                    <img src="assets/perfect_shine_text_clean.png" alt="Perfect Shine Auto Spa" class="sponsor-logo">
                    <img src="assets/lat_oils_logo.png" alt="LAT Oils" class="sponsor-logo">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
